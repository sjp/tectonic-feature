name: "CI - Test Feature"

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Uses the official devcontainer test harness on Debian-based images.
  # Covers: autogenerated default-options test + the custom installDirectory
  # scenario, across x86_64 (drop-sh gnu build) and arm64 (musl fallback).
  test:
    name: "devcontainer test (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: "Run autogenerated + scenario tests (Debian base)"
        run: devcontainer features test -f tectonic -i mcr.microsoft.com/devcontainers/base:trixie .

  # Alpine isn't run through the devcontainer test harness because the test
  # library requires bash (absent from stock Alpine). Instead we execute
  # install.sh directly in an Alpine container to exercise the apk path and,
  # on arm64, the musl fallback.
  smoke-alpine:
    name: "alpine smoke (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: "Install tectonic on Alpine via install.sh"
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work alpine:3.20 \
            sh -c 'INSTALLDIRECTORY=/usr/local/bin sh src/tectonic/install.sh && tectonic --version'
